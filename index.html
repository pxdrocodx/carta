<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>para Jeni...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Caveat:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">

  <!-- ================= TELA 1 — ENVELOPE ================= -->
  <section id="screen-envelope" class="screen screen--active" aria-label="Envelope fechado">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir carta">
      <div class="envelope__label">para Jeni...</div>

      <div class="envelope__body">
        <div class="envelope__flap-back"></div>
        <div class="envelope__pocket"></div>
        <div class="envelope__flap-front"></div>
        <div class="seal" id="seal" aria-hidden="true">
          <svg viewBox="0 0 60 60" class="seal__heart">
            <path d="M30 50 C10 36 2 24 2 14 C2 5 9 0 16 0 C22 0 27 4 30 10 C33 4 38 0 44 0 C51 0 58 5 58 14 C58 24 50 36 30 50 Z"/>
          </svg>
        </div>
        <span class="envelope__corner envelope__corner--tl">❧</span>
        <span class="envelope__corner envelope__corner--br">❧</span>
      </div>

      <p class="envelope__hint">toque para abrir</p>
    </div>
  </section>

  <!-- ================= TELAS 2 & 3 — CARTA ================= -->
  <section id="screen-letter" class="screen" aria-label="Carta aberta">
    <div class="phone-ui">
      <span class="phone-ui__icon phone-ui__icon--music" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="17.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </span>
    </div>

    <!-- Pop-up Spotify -->
    <div class="spotify-card" id="spotifyCard">
      <div class="spotify-card__top">
        <img src="assets/album-cover.svg" alt="Capa do álbum" class="spotify-card__cover" id="spotifyCover">
        <div class="spotify-card__info">
          <p class="spotify-card__title" id="spotifyTitle">Moonlight</p>
          <p class="spotify-card__artist" id="spotifyArtist">Kali Uchis</p>
        </div>
        <svg class="spotify-card__logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1DB954"/><path d="M6.5 9.5c3.2-.9 7.3-.7 10 .9M6.9 12.7c2.7-.7 6-.6 8.4.8M7.3 15.7c2.3-.5 5-.4 7 .8" stroke="#000" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="spotify-card__progress">
        <div class="spotify-card__bar"><div class="spotify-card__fill" id="spotifyFill"></div></div>
        <div class="spotify-card__time"><span id="spotifyElapsed">0:00</span><span id="spotifyDuration">3:08</span></div>
      </div>
      <div class="spotify-card__controls">
        <button aria-label="Aleatório" class="spotify-card__ctrl spotify-card__ctrl--sm">
          <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M3 7h6l3 4M21 17l-4 4-4-4M3 17h6l3-4M14 7l1.5 2M14 17l1.5-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button aria-label="Anterior" class="spotify-card__ctrl">
          <svg viewBox="0 0 24 24"><path d="M19 5v14L8 12l11-7zM6 5v14" stroke="currentColor" stroke-width="1.6" fill="currentColor" stroke-linejoin="round"/></svg>
        </button>
        <button aria-label="Reproduzir/pausar" class="spotify-card__ctrl spotify-card__ctrl--play" id="playPause">
          <svg viewBox="0 0 24 24" id="iconPause"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        </button>
        <button aria-label="Próxima" class="spotify-card__ctrl">
          <svg viewBox="0 0 24 24"><path d="M5 5v14l11-7L5 5zM18 5v14" stroke="currentColor" stroke-width="1.6" fill="currentColor" stroke-linejoin="round"/></svg>
        </button>
        <button aria-label="Repetir" class="spotify-card__ctrl spotify-card__ctrl--sm">
          <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M21 6H8a5 5 0 0 0-5 5v1M7 22l-4-4 4-4M3 18h13a5 5 0 0 0 5-5v-1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <!-- Folha da carta -->
    <div class="letter" id="letter">
      <span class="letter__corner letter__corner--tl">❧</span>
      <span class="letter__corner letter__corner--br">❧</span>

      <div class="letter__page" id="letterPage">
        <p id="pageText" class="letter__text"></p>
        <span class="caret" id="caret">|</span>
      </div>

      <div class="letter__nav">
        <button class="letter__arrow" id="prevPage" aria-label="Página anterior" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="letter__page-count" id="pageCount"></span>
        <button class="letter__arrow" id="nextPage" aria-label="Próxima página">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <button class="photo-fab" id="photoFab" aria-label="Abrir galeria de fotos" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="1.3" transform="rotate(-8 10 12)"/><rect x="6" y="3" width="14" height="17" rx="1" fill="#0d0d0d" stroke="currentColor" stroke-width="1.3"/><circle cx="13" cy="9" r="2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <span class="photo-fab__dot" id="photoDot"></span>
    </button>
  </section>

  <!-- ================= MODAL GALERIA ================= -->
  <div class="modal" id="galleryModal" aria-hidden="true">
    <div class="modal__backdrop" id="modalBackdrop"></div>
    <div class="modal__card" role="dialog" aria-label="Galeria de memórias">
      <button class="modal__nav modal__nav--prev" id="galleryPrev" aria-label="Foto anterior">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="modal__close" id="galleryClose" aria-label="Fechar galeria">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>

      <div class="polaroid-track" id="polaroidTrack">
        <!-- as fotos de cada página são inseridas aqui via script.js (ver CONFIG.pages) -->
      </div>

      <button class="modal__nav modal__nav--next" id="galleryNext" aria-label="Próxima foto">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="modal__dots" id="modalDots"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
